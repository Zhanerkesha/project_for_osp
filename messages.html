<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Ewha Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="messages.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="index.html" class="brand-logo">🌸 Ewha<br>Market</a>
            <nav class="side-nav" aria-label="Main navigation">
                <a href="index.html" class="side-link">🏠 Home</a>
                <a href="categories.html" class="side-link">🗂️ Categories</a>
                <a href="messages.html" class="side-link active">💬 Chat</a>
                <a href="profile.html" class="side-link">👤 My Profile</a>
            </nav>
            <div class="sidebar-banner">
                <div class="banner-emoji">🎓</div>
                <p><strong>Ewha Campus Hub</strong></p>
                <small>Verified students only<br>(@ewha.ac.kr / @ewhain.net)</small>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <form action="search.html" method="GET" class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" name="q" placeholder="Enter item title, course code, or keyword..." aria-label="Enter item title">
                    <a href="search.html" class="filter-btn" title="Filters">🎛️</a>
                </form>
                <div class="topbar-actions">
                    <button id="langToggle" class="lang-btn" type="button">🌐 EN ▾</button>
                    <a href="messages.html" class="icon-btn" title="Chat">💬</a>
                    <a href="login.html" class="login-pill" title="Profile / Log In">👤 Log In</a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-header">
                    <h1>💬 Campus Messages</h1>
                    <p class="text-muted">Chat directly with Ewha buyers, sellers, and study partners</p>
                </div>

                <!-- Zhansaya: Add a list of dialogs and a real chat window here -->
                <section class="content-card">
                    <div class="chat-tabs">
                        <button type="button" class="chat-tab is-active" data-role="buyer">Buying</button>
                        <button type="button" class="chat-tab" dat-role="seller">Selling</button>
                    </div>
                    <div id="chatLayout" class="chat-layout">
                        <!-- LEFT: conversation list-->
                        <aside class="chat-sidebar">
                            <div class="chat-search">
                                <span aria-hidden="true">🔍</span>
                                <input id="chatSearch" type="search" placeholder="Search conversations..." aria-label="Search conversations">
                            </div>

                            <ul id="chatList" class="chat-list">
                                <!-- Fake chat 1 (active) -->
                                <li>
                                    <button type="button" class="chat-list-item is-active">
                                        <div class="chat-avatar">M</div>
                                        <div class="chat-list-body">
                                            <div class="chat-list-top">
                                                <span class="chat-list-name">Kim Ewha</span>
                                                <span class="chat-list-time">11:49 PM</span>
                                            </div>
                                            <p class="chat-list-listing">iPad Air · ₩350,000</p>
                                            <p class="chat-list-preview">Is the iPad still available?</p>
                                        </div>
                                        <span class="chat-badge">1</span>
                                    </button>
                                </li>

                                <!--Fake chat 2-->
                                <li>
                                    <button type="button" class="chat-list-item">
                                        <div class="chat-avatar">M</div>
                                        <div class="chat-list-body">
                                            <div class="chat-list-top">
                                                <span class="chat-list-name">Han Ewha</span>
                                                <span class="chat-list-time">Yesterday</span>
                                            </div>
                                            <p class="chat-list-listing">Economics Textbook · ₩12,000</p>
                                            <p class="chat-list-preview">Can we meet at ECC?</p>
                                        </div>
                                    </button>
                                </li>

                                <!--Fake chat 3-->
                                <li>
                                    <button type="button" class="chat-list-item">
                                        <div class="chat-avatar">M</div>
                                        <div class="chat-list-body">
                                            <div class="chat-list-top">
                                                <span class="chat-list-name">Lee Ewha</span>
                                                <span class="chat-list-time">Tue</span>
                                            </div>
                                            <p class="chat-list-listing">Sony Headphones · ₩45,000</p>
                                            <p class="chat-list-preview">Is this still available?</p>
                                        </div>
                                        <span class="chat-badge">3</span>
                                    </button>
                                </li>
                            </ul>

                            <p id="chatListEmpty" class="chat-empty" hidden>No conversations yet</p>
                        </aside>
                        <!-- RIGHT: chat window-->
                        <section class="chat-window">

                        </section>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Ewha Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="index.html" class="brand-logo">🌸 Ewha<br>Market</a>
            <nav class="side-nav" aria-label="Main navigation">
                <a href="index.html" class="side-link">🏠 Home</a>
                <a href="categories.html" class="side-link">🗂️ Categories</a>
                <a href="messages.html" class="side-link active">💬 Chat</a>
                <a href="profile.html" class="side-link">👤 My Profile</a>
            </nav>
            <div class="sidebar-banner">
                <div class="banner-emoji">🎓</div>
                <p><strong>Ewha Campus Hub</strong></p>
                <small>Verified students only<br>(@ewha.ac.kr / @ewhain.net)</small>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <form action="search.html" method="GET" class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" name="q" placeholder="Enter item title, course code, or keyword..." aria-label="Enter item title">
                    <a href="search.html" class="filter-btn" title="Filters">🎛️</a>
                </form>
                <div class="topbar-actions">
                    <button id="langToggle" class="lang-btn" type="button">🌐 EN ▾</button>
                    <a href="messages.html" class="icon-btn" title="Chat">💬</a>
                    <a href="login.html" class="login-pill" title="Profile / Log In">👤 Log In</a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-header">
                    <h1>💬 Campus Messages</h1>
                    <p class="text-muted">Chat directly with Ewha buyers, sellers, and study partners</p>
                </div>

                <!-- Zhansaya: Add a list of dialogs and a real chat window here -->
                <section class="content-card">
                    <p>Chat interface goes here...</p>
                </section>
            </main>
        </div>
    </div>
</body>
</html>

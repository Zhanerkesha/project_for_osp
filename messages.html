<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Ewha Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="messages.css">
    <link rel="stylesheet" href="auth-ui.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="index.html" class="brand-logo">
                <svg class="brand-flower" viewBox="4 4 56 56" width="44" height="44" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path
                        d="M32 32 C25 22, 23 11, 29 8 C31 7, 32 9.5, 32 9.5 C32 9.5, 33 7, 35 8 C41 11, 39 22, 32 32 Z" />
                    <path
                        d="M32 32 C25 22, 23 11, 29 8 C31 7, 32 9.5, 32 9.5 C32 9.5, 33 7, 35 8 C41 11, 39 22, 32 32 Z"
                        transform="rotate(72 32 32)" />
                    <path
                        d="M32 32 C25 22, 23 11, 29 8 C31 7, 32 9.5, 32 9.5 C32 9.5, 33 7, 35 8 C41 11, 39 22, 32 32 Z"
                        transform="rotate(144 32 32)" />
                    <path
                        d="M32 32 C25 22, 23 11, 29 8 C31 7, 32 9.5, 32 9.5 C32 9.5, 33 7, 35 8 C41 11, 39 22, 32 32 Z"
                        transform="rotate(216 32 32)" />
                    <path
                        d="M32 32 C25 22, 23 11, 29 8 C31 7, 32 9.5, 32 9.5 C32 9.5, 33 7, 35 8 C41 11, 39 22, 32 32 Z"
                        transform="rotate(288 32 32)" />

                    <line x1="32" y1="32" x2="32" y2="21" stroke-width="1.8" />
                    <line x1="32" y1="32" x2="42.5" y2="28.5" stroke-width="1.8" />
                    <line x1="32" y1="32" x2="38.5" y2="41" stroke-width="1.8" />
                    <line x1="32" y1="32" x2="25.5" y2="41" stroke-width="1.8" />
                    <line x1="32" y1="32" x2="21.5" y2="28.5" stroke-width="1.8" />

                    <circle cx="32" cy="32" r="3.2" fill="#f1f5f9" stroke="currentColor" stroke-width="2.2" />
                </svg>
                <span>Ewha<br>Market</span>
            </a>
            <!-- <a href="index.html" class="brand-logo">🌸 Ewha<br>Market</a> -->
            <nav class="side-nav" aria-label="Main navigation">
                <a href="index.html" class="side-link">🏠 <span data-i18n="nav.home">Home</span></a>
                <a href="categories.html" class="side-link">🗂️ <span data-i18n="nav.categories">Categories</span></a>
                <a href="messages.html" class="side-link active">💬 <span data-i18n="nav.chat">Chat</span></a>
                <a href="profile.html" class="side-link">👤 <span data-i18n="nav.profile">My Profile</span></a>
            </nav>
            <div class="sidebar-banner">
                <div class="banner-emoji">🎓</div>
                <p><strong data-i18n="sidebar.hub">Ewha Campus Hub</strong></p>
                <small><span data-i18n="chat.sidebar.verified">Verified students only</span><br>(@ewha.ac.kr /
                    @ewhain.net)</small>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">

                <div class="topbar-actions messages-topbar-actions">
                    <button id="langToggle" class="lang-btn" type="button">🌐 EN ▾</button>
                    <a href="login.html" class="login-pill" title="Profile / Log In" data-i18n="nav.login">👤 Log In</a>
                </div>
            </header>

            <main class="page-content">
                <div class="page-header">
                    <h1 data-i18n="chat.title">💬 Campus Messages</h1>
                    <p class="text-muted" data-i18n="chat.subtitle">Chat directly with Ewha buyers, sellers, and study
                        partners</p>
                </div>

                <div class="chat-tabs">
                    <button type="button" class="chat-tab is-active" data-role="buyer"
                        data-i18n="chat.tab.buying">Buying</button>
                    <button type="button" class="chat-tab" data-role="seller"
                        data-i18n="chat.tab.selling">Selling</button>
                </div>
                <div id="chatStatus" class="chat-status" role="status" hidden></div>
                <div id="chatLayout" class="chat-layout">
                    <!-- LEFT: conversation list -->
                    <aside class="chat-sidebar">
                        <div class="chat-sidebar-top">
                            <div class="chat-search">
                                <span aria-hidden="true">🔍</span>
                                <input id="chatSearch" type="search" placeholder="Search conversations..."
                                    aria-label="Search conversations" data-i18n-placeholder="chat.search.placeholder"
                                    data-i18n-aria="chat.search.aria">
                            </div>
                            <button id="chatAddToggle" type="button" class="chat-add-toggle" aria-expanded="false"
                                aria-controls="chatAddForm" aria-label="Add a person by email"
                                data-i18n="chat.add.toggle" data-i18n-aria="chat.add.aria">+ Add</button>
                        </div>

                        <!-- Add a person by email (hidden until "+ Add" is clicked) -->
                        <form id="chatAddForm" class="chat-add-form" hidden>
                            <label for="chatAddEmail" class="chat-add-label" data-i18n="chat.add.label">Start a chat by
                                email</label>
                            <div class="chat-add-row">
                                <input id="chatAddEmail" type="email" placeholder="name@ewhain.net" autocomplete="off"
                                    required>
                                <button id="chatAddSubmit" type="submit" class="chat-add-submit"
                                    data-i18n="chat.add.submit">Add</button>
                                <button id="chatAddCancel" type="button" class="chat-add-cancel" aria-label="Cancel"
                                    data-i18n-aria="chat.add.cancel">✕</button>
                            </div>
                            <p id="chatAddMessage" class="chat-add-message" role="status" hidden></p>
                        </form>

                        <ul id="chatList" class="chat-list"></ul>

                        <p id="chatListEmpty" class="chat-empty" hidden data-i18n="chat.list.empty">No conversations yet
                        </p>
                    </aside>
                    <!-- RIGHT: chat window -->
                    <section class="chat-window">
                        <!-- Shown when no chat is selected -->
                        <div id="chatPlaceholder" class="chat-placeholder">
                            <span class="chat-placeholder-icon">💬</span>
                            <p data-i18n="chat.placeholder">Select a conversation to start chatting</p>
                        </div>

                        <div id="chatActive" class="chat-active" hidden>
                            <!-- Top: who I'm talking to + which item -->
                            <header class="chat-header">
                                <div class="chat-user">
                                    <button id="chatBack" type="button" class="chat-back"
                                        aria-label="Back to conversations" data-i18n-aria="chat.back">←</button>
                                    <div id="chatUserAvatar" class="chat-avatar"></div>
                                    <div>
                                        <p id="chatUserName" class="chat-user-name"></p>
                                        <p id="chatUserRole" class="chat-user-role"></p>
                                    </div>
                                </div>
                                <a id="chatItem" class="chat-item" href="#">
                                    <img id="chatItemImg" class="chat-item-img" alt="">
                                    <div>
                                        <p id="chatItemTitle" class="chat-item-title"></p>
                                        <p id="chatItemPrice" class="chat-item-price"></p>
                                    </div>
                                </a>
                            </header>

                            <!-- Middle: messages -->
                            <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

                            <!-- Bottom: input. A <form>, so Enter = send -->
                            <!-- Picked files appear here before sending -->
                            <div id="chatAttachPreview" class="chat-attach-preview" hidden></div>

                            <!-- Bottom: input. A <form>, so Enter = send -->
                            <form id="chatForm" class="chat-form">
                                <input id="chatInput" type="text" placeholder="Type a message..." maxlength="1000"
                                    autocomplete="off" aria-label="Message"
                                    data-i18n-placeholder="chat.input.placeholder" data-i18n-aria="chat.input.aria">

                                <!-- Hidden real file picker; the 📎 button opens it -->
                                <input id="chatFile" type="file" multiple hidden>
                                <button id="chatAttach" type="button" class="chat-attach" aria-label="Attach file"
                                    data-i18n-aria="chat.attach">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        aria-hidden="true">
                                        <path
                                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                                    </svg>
                                </button>

                                <button type="submit" class="chat-send" data-i18n="chat.send">Send</button>
                            </form>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="listings-i18n.js"></script>
    <script src="lang-toggle.js"></script>
    <script src="messages-i18n.js"></script>
    <script type="module" src="messages.js"></script>
    <script type="module" src="auth-ui.js"></script>
</body>

</html>
